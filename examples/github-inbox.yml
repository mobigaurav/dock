# Drop into any repo as .github/workflows/dock.yml
# Uses GITHUB_TOKEN so `gh` can see the current pull request.

name: dock

on:
  pull_request:

jobs:
  inbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dock
        run: pip install "git+https://github.com/mobigaurav/dock.git"
      - name: Claim inbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: dock inbox --path . --since 7d --format md
